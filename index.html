<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTS</title>
</head>
<style>/* Reset & Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff0f5;
    color: #333;
    padding: 20px;
}

/* Headings */
h1, h2 {
    color: #d63384;
    text-align: center;
    margin-top: 30px;
    margin-bottom: 20px;
}

/* Ordered & Unordered Lists */
ol, ul {
    margin: 20px auto;
    width: 60%;
    padding-left: 40px;
    font-size: 1.1rem;
}

li {
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    transition: all 0.3s ease;
    cursor: pointer;
}

li:hover {
    background-color: #ffd6ea;
    transform: translateX(5px);
}

/* Table Styles */
table {
    width: 80%;
    margin: 30px auto;
    border-collapse: collapse;
    background-color: #ffe6f0;
    box-shadow: 0 0 10px rgba(214, 51, 132, 0.2);
    animation: fadeIn 1s ease-in;
}

th, td {
    padding: 14px 18px;
    border: 1px solid #d63384;
    text-align: left;
}

th {
    background-color: #d63384;
    color: white;
    letter-spacing: 0.5px;
}

tr:hover {
    background-color: #fcddec;
    transition: background-color 0.3s ease;
}

/* Fade-in Animation */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Definition List Placeholder */
dl {
    width: 60%;
    margin: 20px auto;
    font-size: 1.1rem;
    color: #666;
}
</style>
<body>
    <h1>Lits in Html</h1>
    <!-- ORDERED LISTS -->
    <h2>Steps Bake cake</h2>
    <ol>
        <li>Am ahma in this html</li>
        <li>Am ahma in this html</li>
        <li>Am ahma in this html</li>
        <li>Am ahma in this html</li>

    </ol>

    <!-- unordered lists -->
    <h1>Genrate a grossery storeS</h1>
    <ul>
        <li> Cup</li>
        <li> Apple</li>
        <li> Mango</li>
        <li> Orange</li>
    </ul>

    <!-- Deffination lists -->
    <dl></dl>
    <!--                                          TABLES                                 -->
    <h1>tables and HTML</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Phone</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ahmad</td>
                <td>24</td>
                <td>7884555</td>
                <td>fsd</td>
            </tr>
            <tr>
                <td>Ali</td>
                <td>64</td>
                <td>7666684555</td>
                <td>fsd</td>
            </tr>
            <tr>
                <td colspan="">azan</td>
                <td colspan="1">288</td>
                
        </tbody>
    </table>
</body>

</html>
